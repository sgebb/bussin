name: MCP Server CI

on:
  push:
    branches: [ main ]
    paths:
      - 'mcp-server/**'
      - 'client-js/**'
      - '.github/workflows/mcp-server-ci.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'client-js/**'
      - '.github/workflows/mcp-server-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test bussin-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The MCP server bundles client-js at build time, so the client needs its own
      # dependencies installed before mcp-server can build.
      - name: Install client-js
        run: npm ci --ignore-scripts
        working-directory: client-js

      - name: Install mcp-server
        run: npm ci --ignore-scripts
        working-directory: mcp-server

      - name: Typecheck
        run: npm run typecheck
        working-directory: mcp-server

      # `npm test` builds first, then drives the server over stdio against the
      # in-process simulator -- no Azure namespace or credentials required.
      - name: Build and test
        run: npm test
        working-directory: mcp-server

      - name: Verify the package is publishable
        run: |
          npm pack --dry-run
          # A file: dependency cannot be resolved by anyone installing from the registry.
          if node -e "process.exit(JSON.stringify(require('./package.json').dependencies).includes('file:') ? 1 : 0)"; then
            echo "No file: dependencies in the published dependency set."
          else
            echo "::error::package.json has a file: dependency in 'dependencies'; it must be bundled or devDependency-only."
            exit 1
          fi

          # 0.1.0 shipped dist/index.js.map, whose sourcesContent embedded the whole
          # built client-js under an MIT declaration. The `files` array prevents a
          # repeat; this asserts it, because that mistake is unpublishable after 72h.
          if npm pack --dry-run --json | node -e "
            let d='';
            process.stdin.on('data', c => d += c).on('end', () => {
              const files = JSON.parse(d)[0].files.map(f => f.path);
              const maps = files.filter(f => f.endsWith('.map'));
              if (maps.length) {
                console.error('::error::Publishable tarball contains sourcemaps: ' + maps.join(', ') + '. Sourcemaps embed client-js sources; keep them out of the files array.');
                process.exit(1);
              }
              console.log('No sourcemaps in the publishable tarball.');
            });
          "; then :; else exit 1; fi

          # The license must stay BUSL-1.1. 0.1.0 went out as MIT.
          if node -e "
            const l = require('./package.json').license;
            if (l !== 'BUSL-1.1') {
              console.error('::error::package.json license is ' + JSON.stringify(l) + ', expected \"BUSL-1.1\".');
              process.exit(1);
            }
            console.log('License is BUSL-1.1.');
          "; then :; else exit 1; fi

          # The registry verifies package ownership by matching this against
          # server.json. Publishing without it silently breaks the listing.
          if node -e "
            const n = require('./package.json').mcpName;
            if (n !== 'io.github.sgebb/bussin-mcp') {
              console.error('::error::package.json mcpName is ' + JSON.stringify(n) + ', expected \"io.github.sgebb/bussin-mcp\" to match the MCP registry entry.');
              process.exit(1);
            }
            console.log('mcpName matches the MCP registry entry.');
          "; then :; else exit 1; fi

          # LICENSE must be in the tarball; 0.1.0 shipped without one.
          if npm pack --dry-run --json | node -e "
            let d='';
            process.stdin.on('data', c => d += c).on('end', () => {
              const files = JSON.parse(d)[0].files.map(f => f.path);
              if (!files.includes('LICENSE')) {
                console.error('::error::Publishable tarball has no LICENSE file. Add it to the files array.');
                process.exit(1);
              }
              console.log('LICENSE ships in the tarball.');
            });
          "; then :; else exit 1; fi
        working-directory: mcp-server
